# Extends k3s' bundled Traefik (deployed by its helm-controller) with a Let's
# Encrypt certificate resolver and a global HTTP→HTTPS redirect — the same model
# the old docker-compose Traefik used (HTTP-01 challenge on :80), now declarative.
# The helm-controller merges this into the chart values and reconciles Traefik.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Allow an IngressRoute in one namespace to reference a Service/Middleware in
    # another — the admin IngressRoute (ns web) routes /grafana to the Grafana
    # Service in ns monitoring.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    # The visitors' real addresses. k3s' servicelb (klipper-lb) MASQUERADEs
    # what it forwards, so Traefik — and the apps behind it, through
    # X-Forwarded-For — saw one internal address for everybody: every per-IP
    # limit was shared by the whole Internet (10 attempts anywhere locked the
    # photo-book login for all). Traefik now takes :80 / :443 on the node
    # itself (hostPort: a DNAT, no masquerade, IPv4 and IPv6 alike), and its
    # Service is internal only, so servicelb no longer holds those ports.
    # Only 80 and 443 are published (not its metrics or API ports, as
    # hostNetwork would). The switch drops connections for a few seconds.
    service:
      spec:
        type: ClusterIP
    # Persist the ACME store so certs survive Traefik restarts (local-path PVC).
    # Traefik creates /data/acme.json (0600) itself; fsGroup makes /data writable.
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: ${ACME_EMAIL}
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    # Redirect every :80 request to :443 (ACME challenges are still served
    # first). The chart's syntax since v34 — the former `redirectTo` was
    # silently ignored: http:// answered 404.
    # Per-client limits on every HTTPS site (15-middlewares.yaml): requests
    # per second and requests at once.
    ports:
      web:
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        hostPort: 443
        http:
          middlewares:
            - web-ratelimit@kubernetescrd
            - web-inflight@kubernetescrd
    # Access logs in JSON on stdout → captured by Promtail into Loki. This is our
    # request-tracing layer: every request in/out through the proxy is recorded
    # (method, host, path, status, duration, backend). Query in Grafana with:
    #   {namespace="kube-system", pod=~"traefik.*"} | json
    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: json
        # Also log the Upgrade request header so WebSocket handshakes are
        # unambiguously identifiable in Loki (field `request_Upgrade=websocket`),
        # independent of the logged status code.
        fields:
          headers:
            defaultmode: drop
            names:
              Upgrade: keep
