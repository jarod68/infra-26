# Per visitor (client IP), on every HTTPS site — attached to the websecure
# entry point (10-traefik-acme.yaml), so no route can forget them:
#  - web-ratelimit: 40 requests a second on average, bursts of 400 (opening
#    an album asks for a page of thumbnails at once); beyond, 429;
#  - web-inflight: 60 requests at once.
# Generous on purpose: an office or a mobile carrier puts many people behind
# one address. The apps keep their own finer limits (photo-book: logins,
# API, geocoding — per client too, now that they see real addresses).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: web
spec:
  rateLimit:
    average: 40
    period: 1s
    burst: 400
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inflight
  namespace: web
spec:
  inFlightReq:
    amount: 60
---
# HSTS response header, applied to every route (Traefik v3 CRD).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: web
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
---
# getaround lives under app.holtz.fr/getaround. The app itself serves from /:
# 1) …/getaround (no slash) is redirected to …/getaround/ so the page's
#    relative asset/API URLs resolve under the prefix;
# 2) the prefix is then stripped before the request reaches the app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: getaround-slash
  namespace: web
spec:
  redirectRegex:
    regex: "^https://([^/]+)/getaround$"
    replacement: "https://${1}/getaround/"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: getaround-strip
  namespace: web
spec:
  stripPrefix:
    prefixes: ["/getaround"]
---
# Whole /getaround path is private — credentials generated by deploy.sh
# (secrets getaround-basic-auth{,-plain}; print with `make password`).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: getaround-auth
  namespace: web
spec:
  basicAuth:
    secret: getaround-basic-auth
    realm: "getaround"
    removeHeader: true
---
# site-gen lives under app.holtz.fr/site-gen — same slash-redirect + strip
# scheme as getaround, and its own basic-auth (secrets site-gen-basic-auth{,-plain}).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-gen-slash
  namespace: web
spec:
  redirectRegex:
    regex: "^https://([^/]+)/site-gen$"
    replacement: "https://${1}/site-gen/"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-gen-strip
  namespace: web
spec:
  stripPrefix:
    prefixes: ["/site-gen"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-gen-auth
  namespace: web
spec:
  basicAuth:
    secret: site-gen-basic-auth
    realm: "site-gen"
    removeHeader: true
