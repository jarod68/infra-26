# Keel — rolls a Deployment when the image behind its tag changes on the
# registry. Polling only: no UI, no webhook endpoint, no Service (nothing is
# exposed). Workloads opt in with keel.sh/* annotations, see 50-mine-sim.yaml:
#   jarod68/mine-sim:qa     → mine-sim-qa  (moved by every green CI run on main)
#   jarod68/mine-sim:latest → mine-sim     (moved only by the "Promote to prod"
#                                           workflow, after a manual approval)
# Adapted from keel-hq/keel deployment/deployment-template.yaml (0.20.0).
apiVersion: v1
kind: Namespace
metadata:
  name: keel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel
  namespace: keel
  labels: { app: keel }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [watch, list]
  - apiGroups: [""]
    resources: [secrets]            # imagePullSecrets, for private registries
    verbs: [get, watch, list]
  - apiGroups: ["", extensions, apps, batch]
    resources: [pods, replicasets, replicationcontrollers, statefulsets, deployments, daemonsets, jobs, cronjobs]
    verbs: [get, delete, watch, list, update]   # delete: force-upgrade of the same tag
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keel
subjects:
  - kind: ServiceAccount
    name: keel
    namespace: keel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  namespace: keel
  labels: { app: keel }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keel }
  template:
    metadata:
      labels: { app: keel }
    spec:
      serviceAccountName: keel
      containers:
        - name: keel
          image: keelhq/keel:0.20.0
          command: ["/bin/keel"]
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: NOTIFICATION_LEVEL, value: info }
          ports:
            - containerPort: 9300
          livenessProbe:
            httpGet: { path: /healthz, port: 9300 }
            initialDelaySeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
