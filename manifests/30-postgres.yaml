apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: web
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: web
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO volume — never run two pods at once
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: photobook }
            - { name: POSTGRES_USER, value: photobook }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            # Keep data in a sub-dir so initdb owns a clean directory on the PVC.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "photobook", "-d", "photobook"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests: { cpu: 50m, memory: 128Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: web
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Backups ───────────────────────────────────────────────────────────────────
# Every night, a pg_dump (custom format: compressed, restorable table by table)
# of the photo-book database into its own volume; the last 14 are kept.
# They protect from a bad migration, a wrong deletion or a corrupt database;
# not from the loss of the VPS disk — copy them off the server for that
# (README → Backups). `make db-backup` takes one now, `make db-backups` lists them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: web
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: web
spec:
  schedule: "30 3 * * *"          # 03:30 every night (server time)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: postgres-backup }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 70               # the postgres user of the alpine image
            runAsGroup: 70
            fsGroup: 70
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: photobook }
                - { name: PGDATABASE, value: photobook }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  f="/backups/photobook-$(date +%Y-%m-%d_%H%M).dump"
                  trap 'rm -f "$f.part"' EXIT   # a failed dump leaves nothing behind
                  pg_dump --format=custom --no-owner --file="$f.part"
                  mv "$f.part" "$f"
                  echo "backup: $f ($(du -h "$f" | cut -f1))"
                  # keep the 14 most recent
                  ls -1t /backups/photobook-*.dump | tail -n +15 | xargs -r rm -f
                  ls -lh /backups
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backups }
