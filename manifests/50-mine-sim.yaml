# mine-sim — full-local build. The whole game runs in the browser (Web Worker +
# IndexedDB); the container is just a zero-dependency static file server. That
# makes it fully stateless: no DB, no WebSocket, no game rooms — so it scales
# horizontally and rolls without downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine-sim
  namespace: web
spec:
  replicas: 2            # stateless static server ⇒ free to run multiple pods
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: mine-sim }
  template:
    metadata:
      labels: { app: mine-sim }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mine-sim
          image: ${MINESIM_IMAGE}
          imagePullPolicy: Always
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3200" }
          ports:
            - containerPort: 3200
          readinessProbe:
            httpGet: { path: /, port: 3200 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mine-sim
  namespace: web
spec:
  selector: { app: mine-sim }
  ports:
    - port: 3200
      targetPort: 3200
