apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: site-gen-data, namespace: web }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-gen
  namespace: web
spec:
  replicas: 1            # in-process scanner + local SQLite ⇒ single instance
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: site-gen }
  template:
    metadata:
      labels: { app: site-gen }
    spec:
      # Image runs as `node` (uid 1000); fsGroup makes /data (DATA_DIR) writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: site-gen
          image: ${SITEGEN_IMAGE}
          imagePullPolicy: Always
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3400" }
            - { name: DATA_DIR, value: /data }
            - { name: TZ, value: Europe/Paris }
            # Google Places API key (site-gen-secrets, from GOOGLE_MAPS_API_KEY in
            # .env). Optional: without it only the OpenStreetMap source is offered.
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef: { name: site-gen-secrets, key: GOOGLE_MAPS_API_KEY, optional: true }
          ports:
            - containerPort: 3400
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 3400 }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Headless Chromium (Google Maps browser source) runs during scans:
          # ~300-500 MB; the limit keeps a runaway browser from starving the node.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1536Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: site-gen-data }
---
apiVersion: v1
kind: Service
metadata:
  name: site-gen
  namespace: web
spec:
  selector: { app: site-gen }
  ports:
    - port: 3400
      targetPort: 3400
