# HTTPS routes (Traefik v3 CRD). TLS certs are obtained on demand via the
# `letsencrypt` resolver defined in 10-traefik-acme.yaml. HTTP→HTTPS redirect is
# global (also in 10-…). HSTS is applied per route.

# photo-book — book.holtz.fr
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: photo-book
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${DOMAIN}`)
      kind: Rule
      services:
        - name: photo-book
          port: 3000
      middlewares:
        - name: hsts
  tls:
    certResolver: letsencrypt
---
# getaround — app.holtz.fr/getaround  (slash redirect + prefix strip, see
# 15-middlewares.yaml; the app serves from / inside the pod)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: getaround
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${APP_DOMAIN}`) && PathPrefix(`/getaround`)
      kind: Rule
      services:
        - name: getaround
          port: 3300
      middlewares:
        - name: hsts
        - name: getaround-slash
        - name: getaround-auth
        - name: getaround-strip
  tls:
    certResolver: letsencrypt
---
# site-gen — app.holtz.fr/site-gen  (same prefix scheme as getaround)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site-gen
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${APP_DOMAIN}`) && PathPrefix(`/site-gen`)
      kind: Rule
      services:
        - name: site-gen
          port: 3400
      middlewares:
        - name: hsts
        - name: site-gen-slash
        - name: site-gen-auth
        - name: site-gen-strip
  tls:
    certResolver: letsencrypt
---
# mine-sim — play.holtz.fr  (full-local build: plain static files, no WebSocket)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mine-sim
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${PLAY_DOMAIN}`)
      kind: Rule
      services:
        - name: mine-sim
          port: 3200
      middlewares:
        - name: hsts
  tls:
    certResolver: letsencrypt
---
# mine-sim QA — qa.play.holtz.fr (the :qa image, before promotion to prod)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mine-sim-qa
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${PLAY_QA_DOMAIN}`)
      kind: Rule
      services:
        - name: mine-sim-qa
          port: 3200
      middlewares:
        - name: hsts
  tls:
    certResolver: letsencrypt
